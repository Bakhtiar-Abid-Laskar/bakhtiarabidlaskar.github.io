name: Deploy Next.js Static Export to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Setup GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Prebuild content validation
        run: npm run prebuild

      - name: Enforce zero raw hex outside tokens.css
        run: node scripts/lint-hex-colors.mjs

      - name: Type check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: "https://www.bakhtiarabidlaskar.tech"
          NEXT_PUBLIC_CANONICAL_URL: "https://www.bakhtiarabidlaskar.tech"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "./out"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
